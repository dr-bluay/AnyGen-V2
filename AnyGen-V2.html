<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnyDesk Address Generator</title>
<style>
  * { box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    min-height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #14151a 0%, #1f2229 100%);
  }

  .card {
    background: #23262e;
    border: 1px solid #343845;
    border-radius: 16px;
    padding: 40px 48px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    width: 100%;
    max-width: 420px;
  }

  h1 {
    margin: 0 0 6px;
    font-size: 18px;
    font-weight: 600;
    color: #e8eaef;
    letter-spacing: 0.5px;
  }

  .subtitle {
    margin: 0 0 28px;
    font-size: 13px;
    color: #8b90a0;
  }

  .address {
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #ef4444;
    background: #191b21;
    border: 1px solid #343845;
    border-radius: 10px;
    padding: 18px 12px;
    margin-bottom: 24px;
    user-select: all;
  }

  .actions {
    display: flex;
    gap: 12px;
    justify-content: center;
  }

  button {
    flex: 1;
    padding: 13px 0;
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }

  button:active { transform: scale(0.97); }

  #generate {
    background: #ef4444;
    color: #fff;
  }
  #generate:hover { background: #dc3535; }

  #copy {
    background: #2f3340;
    color: #cfd3dd;
  }
  #copy:hover { background: #3a3f4e; }

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #2f3340;
    color: #e8eaef;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.25s, transform 0.25s;
    pointer-events: none;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>
  <div class="card">
    <h1>AnyDesk Address Generator</h1>
    <p class="subtitle">Randomly generated - for demo purposes only</p>

    <div class="address" id="address">0 000 000 000</div>

    <div class="actions">
      <button id="generate" onclick="generateAddress()">Generate</button>
      <button id="copy" onclick="copyAddress()">Copy</button>
    </div>
  </div>

  <div class="toast" id="toast">Copied to clipboard</div>

  <script>
    function generateAddress() {
      // 10-digit number, first digit 1-9, rest 0-9
      let digits = String(Math.floor(Math.random() * 9) + 1);
      for (let i = 0; i < 9; i++) {
        digits += String(Math.floor(Math.random() * 10));
      }
      // Format as "1 970 385 073" -> 1-3-3-3 grouping
      const formatted =
        digits.slice(0, 1) + ' ' +
        digits.slice(1, 4) + ' ' +
        digits.slice(4, 7) + ' ' +
        digits.slice(7, 10);
      document.getElementById('address').textContent = formatted;
    }

    function copyAddress() {
      const text = document.getElementById('address').textContent;
      navigator.clipboard.writeText(text).then(() => {
        showToast();
      }).catch(() => {
        // Fallback for older browsers or non-secure contexts
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast();
      });
    }

    function showToast() {
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1500);
    }

    generateAddress();
  </script>
</body>
</html>
